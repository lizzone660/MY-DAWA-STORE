name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --org com.mydawastore .
      - name: Configure persistent Android release signing
        env:
          ANDROID_KEYSTORE_GZIP_BASE64: ${{ secrets.ANDROID_KEYSTORE_GZIP_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_GZIP_BASE64"
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_GZIP_BASE64" | base64 --decode | gzip --decompress > android/app/upload-keystore.p12
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.p12
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = "import java.util.Properties\\nimport java.io.FileInputStream\\n\\n" + s
          props = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          if "val keystoreProperties =" not in s:
              s = s.replace("android {", props + "android {", 1)
          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          '''
          if 'signingConfigs {\n        create("release")' not in s:
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1
          )
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit("Could not configure release signing in generated Gradle file")
          p.write_text(s)
          PY
      - name: Build signed Android release APK
        run: flutter build apk --release
      - name: Verify APK signature and calculate checksum
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: my-dawa-store-android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
